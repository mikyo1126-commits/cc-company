name: "下書き手動生成"

on:
  workflow_dispatch:
    inputs:
      slot:
        description: '投稿スロット (morning/noon/evening)'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - noon
          - evening

env:
  TZ: Asia/Tokyo

jobs:
  draft-generate:
    name: draft-generate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: install-deps
        run: pip install -r requirements.txt

      - name: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: install-claude-cli
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: validate-token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set"
            exit 1
          fi

      - name: determine-slot
        id: slot
        run: |
          DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          echo "DATE=$DATE" >> $GITHUB_ENV
          SLOT="${{ github.event.inputs.slot }}"
          echo "SLOT=$SLOT" >> $GITHUB_ENV
          case "$SLOT" in
            morning) SLOT_LABEL="朝" ;;
            noon)    SLOT_LABEL="昼" ;;
            evening) SLOT_LABEL="晩" ;;
          esac
          echo "SLOT_LABEL=$SLOT_LABEL" >> $GITHUB_ENV
          echo "::notice::Slot: $SLOT ($SLOT_LABEL) for $DATE"

      - name: step1-collect-plan
        run: |
          mkdir -p "marketing/content-plan/drafts/$DATE/$SLOT"
          python3 workflow/01_collect_trends.py --date "$DATE" --slot "$SLOT"

      - name: step2-analyze-trends
        id: step2
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          SLOT_DIR="marketing/content-plan/drafts/$DATE/$SLOT"
          {
            cat workflow/prompts/02_analyze_trends.md
            printf '\n\n---\n## Data\n\n'
            printf '### search_plan.json\n```json\n'
            cat "$SLOT_DIR/search_plan.json"
            printf '\n```\n\n'
            printf '### existing_themes.json\n```json\n'
            cat "$SLOT_DIR/existing_themes.json"
            printf '\n```\n'
          } > /tmp/prompt_step2.txt
          set +e
          OUTPUT=$(claude --print --dangerously-skip-permissions - < /tmp/prompt_step2.txt 2>&1)
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::step2 failed"
            echo "$OUTPUT"
            exit $EXIT_CODE
          fi
          echo "$OUTPUT" > "$SLOT_DIR/raw_trends.md"

      - name: step3-generate-draft
        id: step3
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          SLOT_DIR="marketing/content-plan/drafts/$DATE/$SLOT"
          {
            cat workflow/prompts/03_generate_single_draft.md
            printf '\n\n---\n## Data\n\n'
            printf '### 投稿スロット\nスロット: %s（%s）\n' "$SLOT" "$SLOT_LABEL"
            printf '\n### raw_trends.md\n'
            cat "$SLOT_DIR/raw_trends.md"
            printf '\n\n### existing_themes.json\n```json\n'
            cat "$SLOT_DIR/existing_themes.json"
            printf '\n```\n\n'
            printf '### feedback.md\n'
            cat workflow/feedback.md
          } > /tmp/prompt_step3.txt
          set +e
          OUTPUT=$(claude --print --dangerously-skip-permissions - < /tmp/prompt_step3.txt 2>&1)
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::step3 failed"
            echo "$OUTPUT"
            exit $EXIT_CODE
          fi
          echo "$OUTPUT" > "$SLOT_DIR/draft.md"
          python3 -c "
import re, sys
path = sys.argv[1]
text = open(path, encoding='utf-8').read()
m = re.search(r'\`\`\`[^\n]*\n(.*?)\`\`\`', text, re.DOTALL)
if m:
    open(path, 'w', encoding='utf-8').write(m.group(1).strip())
" "$SLOT_DIR/draft.md"

      - name: step4-verify-template
        run: python3 workflow/03_verify_drafts.py --date "$DATE" --slot "$SLOT"

      - name: step5-verify-and-fix
        id: step5
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          SLOT_DIR="marketing/content-plan/drafts/$DATE/$SLOT"
          VERIFIED=false
          for ATTEMPT in 1 2 3; do
            python3 workflow/03_verify_drafts.py --date "$DATE" --slot "$SLOT"
            {
              cat workflow/prompts/05_verify_facts.md
              printf '\n\n---\n## Data\n\n### draft.md\n'
              cat "$SLOT_DIR/draft.md"
              printf '\n\n### verification_template.json\n```json\n'
              cat "$SLOT_DIR/verification_template.json"
              printf '\n```\n'
            } > /tmp/prompt_step5.txt
            set +e
            OUTPUT=$(claude --print --dangerously-skip-permissions - < /tmp/prompt_step5.txt 2>&1)
            EXIT_CODE=$?
            set -e
            if [ $EXIT_CODE -ne 0 ]; then exit $EXIT_CODE; fi
            echo "$OUTPUT" > "$SLOT_DIR/verification_log.md"
            if ! grep -q "^- ❌" "$SLOT_DIR/verification_log.md"; then
              VERIFIED=true
              break
            fi
            if [ $ATTEMPT -lt 3 ]; then
              {
                cat workflow/prompts/06_fix_draft.md
                printf '\n\n---\n## 現在の下書き\n\n'
                cat "$SLOT_DIR/draft.md"
                printf '\n\n---\n## 検証ログ\n\n'
                cat "$SLOT_DIR/verification_log.md"
              } > /tmp/prompt_fix.txt
              set +e
              FIXED=$(claude --print --dangerously-skip-permissions - < /tmp/prompt_fix.txt 2>&1)
              set -e
              echo "$FIXED" > "$SLOT_DIR/draft.md"
            fi
          done
          if [ "$VERIFIED" = "false" ]; then
            echo "::error::Fact verification failed after 3 attempts"
            exit 1
          fi

      - name: commit-draft
        run: |
          git config user.name "hajime-bot[workflow]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "marketing/content-plan/drafts/$DATE/$SLOT/"
          if git diff --cached --quiet; then
            echo "::notice::nothing to commit"
            exit 0
          fi
          git commit -m "draft: [$DATE/$SLOT] draft verified and ready"
          git push
