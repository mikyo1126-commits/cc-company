name: "X自動投稿"

# 投稿時刻: 毎日 9:00 / 12:00 / 15:00 / 18:00 JST
#
# GitHubの予約実行は数時間〜半日遅れ、遅れ方も一定しない。そこで1日中ほぼ1時間半おきに起動を仕掛け、
# 届いた起動は、「5時間前〜2時間後」の範囲に入っている投稿時刻のうち、今日まだ投稿していない一番早いものを担当する。
# 投稿済みかどうかは workflow/posted_log.jsonl（投稿のたびにコミットされる記録）で判断する。
# 生成・検証を済ませてから投稿時刻ちょうどまで待って投稿する。それ以外の時間・投稿済みの回は数秒で終了する。
on:
  schedule:
    - cron: '7 0 * * *'
    - cron: '37 1 * * *'
    - cron: '7 3 * * *'
    - cron: '37 4 * * *'
    - cron: '7 6 * * *'
    - cron: '37 7 * * *'
    - cron: '7 9 * * *'
    - cron: '37 10 * * *'
    - cron: '7 12 * * *'
    - cron: '37 13 * * *'
    - cron: '7 15 * * *'
    - cron: '37 16 * * *'
    - cron: '7 18 * * *'
    - cron: '37 19 * * *'
    - cron: '7 21 * * *'
    - cron: '37 22 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: '投稿スロット（手動実行はすぐに投稿する）'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - noon
          - afternoon
          - evening
      post_at:
        description: '投稿時刻 HH:MM（日本時間）。空欄ならすぐ投稿'
        required: false
        default: ''

env:
  TZ: Asia/Tokyo

concurrency:
  group: x-auto
  cancel-in-progress: false

jobs:
  auto-post:
    name: auto-post
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: decide
        id: decide
        run: |
          DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          echo "DATE=$DATE" >> $GITHUB_ENV
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "SLOT=${{ github.event.inputs.slot }}" >> $GITHUB_ENV
            POST_AT_HM="${{ github.event.inputs.post_at }}"
            if [ -n "$POST_AT_HM" ]; then
              echo "POST_AT=$(TZ=Asia/Tokyo date -d "$DATE $POST_AT_HM" +%s)" >> $GITHUB_ENV
            fi
            echo "go=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          NOW=$(date +%s)
          SLOT=""
          for CAND in "morning 09:00" "noon 12:00" "afternoon 15:00" "evening 18:00"; do
            set -- $CAND
            T=$(TZ=Asia/Tokyo date -d "$DATE $2" +%s)
            if [ "$NOW" -ge $((T - 18000)) ] && [ "$NOW" -le $((T + 7200)) ]; then
              if grep -q "\"posted_at\": \"$DATE.*\"slot\": \"$1\"" workflow/posted_log.jsonl 2>/dev/null; then
                continue
              fi
              SLOT=$1; TARGET_HM=$2; TARGET=$T
              break
            fi
          done
          if [ -z "$SLOT" ]; then
            echo "::notice::担当できる投稿時刻（5時間前〜2時間後で、今日まだ投稿していないもの）がないので、この回は何もしない"
            echo "go=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "SLOT=$SLOT" >> $GITHUB_ENV
          echo "slot=$SLOT" >> $GITHUB_OUTPUT
          if [ "$NOW" -gt $((TARGET + 1800)) ]; then
            echo "::warning::$SLOT: 目標 $TARGET_HM より遅れて起動したので、すぐに投稿する"
          fi
          echo "POST_AT=$TARGET" >> $GITHUB_ENV
          echo "go=true" >> $GITHUB_OUTPUT

      - name: check-already-posted
        id: marker
        if: steps.decide.outputs.go == 'true' && env.SLOT != ''
        uses: actions/cache/restore@v4
        with:
          path: .posted-marker
          key: posted-${{ env.DATE }}-${{ env.SLOT }}
          lookup-only: true

      - name: gate
        id: gate
        run: |
          if [ "${{ steps.decide.outputs.go }}" != "true" ]; then
            echo "run=false" >> $GITHUB_OUTPUT
          elif [ "${{ steps.marker.outputs.cache-hit }}" = "true" ]; then
            echo "::notice::$SLOT は今日すでに投稿済みなので終了"
            echo "run=false" >> $GITHUB_OUTPUT
          else
            echo "run=true" >> $GITHUB_OUTPUT
          fi

      - name: setup-python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: install-deps
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: setup-node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: install-claude-cli
        if: steps.gate.outputs.run == 'true'
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: validate-token
        if: steps.gate.outputs.run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set in GitHub Secrets"
            exit 1
          fi
          echo "::notice::OAuth token validated"

      - name: generate-and-post
        if: steps.gate.outputs.run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: |
          echo "::notice::Slot: $SLOT / Date: $DATE / Post at: ${POST_AT:-now}"
          python3 workflow/auto_post.py "$SLOT"
          echo "posted" > .posted-marker

      - name: mark-posted
        if: steps.gate.outputs.run == 'true' && env.SLOT != ''
        uses: actions/cache/save@v4
        with:
          path: .posted-marker
          key: posted-${{ env.DATE }}-${{ env.SLOT }}

      - name: record-post
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "hajime-bot[workflow]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add workflow/posted_log.jsonl
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "log: [$DATE $SLOT] 自動投稿を記録"
          for i in 1 2 3 4; do
            git pull --rebase -q origin master && git push -q origin HEAD:master && exit 0
            sleep $((i * 5))
          done
          echo "::warning::投稿の記録をpushできなかった（投稿自体は完了）"
