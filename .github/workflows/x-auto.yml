name: "X自動投稿"

# 投稿時刻: 毎日 朝 9:00 JST / 夜 18:00 JST
#
# GitHubの予約実行は2〜5時間遅れ、遅れ方も一定しない。そこで各スロットで目標時刻の
# 約6時間前から6回起動を仕掛け、「目標の30分前〜2時間後」に着いた最初の1回だけが
# 生成・検証を済ませてから目標時刻ちょうどまで待って投稿する。早すぎ・遅すぎ・投稿済みの回は数秒で終了する。
on:
  schedule:
    # 朝 9:00 JST (= 00:00 UTC) 向け
    - cron: '7 18 * * *'
    - cron: '17 19 * * *'
    - cron: '27 20 * * *'
    - cron: '37 21 * * *'
    - cron: '47 22 * * *'
    - cron: '37 23 * * *'
    # 夜 18:00 JST (= 09:00 UTC) 向け
    - cron: '7 3 * * *'
    - cron: '17 4 * * *'
    - cron: '27 5 * * *'
    - cron: '37 6 * * *'
    - cron: '47 7 * * *'
    - cron: '37 8 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: '投稿スロット（手動実行はすぐに投稿する）'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - noon
          - evening
      post_at:
        description: '投稿時刻 HH:MM（日本時間）。空欄ならすぐ投稿'
        required: false
        default: ''

env:
  TZ: Asia/Tokyo

concurrency:
  group: x-auto
  cancel-in-progress: false

jobs:
  auto-post:
    name: auto-post
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write

    steps:
      - name: decide
        id: decide
        run: |
          DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          echo "DATE=$DATE" >> $GITHUB_ENV
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "SLOT=${{ github.event.inputs.slot }}" >> $GITHUB_ENV
            POST_AT_HM="${{ github.event.inputs.post_at }}"
            if [ -n "$POST_AT_HM" ]; then
              echo "POST_AT=$(TZ=Asia/Tokyo date -d "$DATE $POST_AT_HM" +%s)" >> $GITHUB_ENV
            fi
            echo "go=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          case "${{ github.event.schedule }}" in
            "7 18 * * *"|"17 19 * * *"|"27 20 * * *"|"37 21 * * *"|"47 22 * * *"|"37 23 * * *") SLOT=morning; TARGET_HM="09:00" ;;
            "7 3 * * *"|"17 4 * * *"|"27 5 * * *"|"37 6 * * *"|"47 7 * * *"|"37 8 * * *")  SLOT=evening; TARGET_HM="18:00" ;;
            *) echo "::error::unknown schedule"; exit 1 ;;
          esac
          TARGET=$(TZ=Asia/Tokyo date -d "$DATE $TARGET_HM" +%s)
          NOW=$(date +%s)
          echo "SLOT=$SLOT" >> $GITHUB_ENV
          echo "slot=$SLOT" >> $GITHUB_OUTPUT
          if [ "$NOW" -lt $((TARGET - 1800)) ]; then
            echo "::notice::$SLOT: 目標 $TARGET_HM の30分より前に起動したので、この回は見送り（後続の起動で投稿）"
            echo "go=false" >> $GITHUB_OUTPUT
          elif [ "$NOW" -gt $((TARGET + 7200)) ]; then
            echo "::warning::$SLOT: 目標 $TARGET_HM から2時間以上遅れて起動したので投稿しない"
            echo "go=false" >> $GITHUB_OUTPUT
          else
            echo "POST_AT=$TARGET" >> $GITHUB_ENV
            echo "go=true" >> $GITHUB_OUTPUT
          fi

      - name: check-already-posted
        id: marker
        if: steps.decide.outputs.go == 'true' && env.SLOT != 'noon'
        uses: actions/cache/restore@v4
        with:
          path: .posted-marker
          key: posted-${{ env.DATE }}-${{ env.SLOT }}
          lookup-only: true

      - name: gate
        id: gate
        run: |
          if [ "${{ steps.decide.outputs.go }}" != "true" ]; then
            echo "run=false" >> $GITHUB_OUTPUT
          elif [ "${{ steps.marker.outputs.cache-hit }}" = "true" ]; then
            echo "::notice::$SLOT は今日すでに投稿済みなので終了"
            echo "run=false" >> $GITHUB_OUTPUT
          else
            echo "run=true" >> $GITHUB_OUTPUT
          fi

      - name: checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: setup-python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: install-deps
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: setup-node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: install-claude-cli
        if: steps.gate.outputs.run == 'true'
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: validate-token
        if: steps.gate.outputs.run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set in GitHub Secrets"
            exit 1
          fi
          echo "::notice::OAuth token validated"

      - name: generate-and-post
        if: steps.gate.outputs.run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: |
          echo "::notice::Slot: $SLOT / Date: $DATE / Post at: ${POST_AT:-now}"
          python3 workflow/auto_post.py "$SLOT"
          echo "posted" > .posted-marker

      - name: mark-posted
        if: steps.gate.outputs.run == 'true' && env.SLOT != 'noon'
        uses: actions/cache/save@v4
        with:
          path: .posted-marker
          key: posted-${{ env.DATE }}-${{ env.SLOT }}

      - name: record-post
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "hajime-bot[workflow]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add workflow/posted_log.jsonl
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "log: [$DATE $SLOT] 自動投稿を記録"
          for i in 1 2 3 4; do
            git pull --rebase -q origin master && git push -q origin HEAD:master && exit 0
            sleep $((i * 5))
          done
          echo "::warning::投稿の記録をpushできなかった（投稿自体は完了）"
