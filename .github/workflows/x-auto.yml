name: "X自動投稿"

on:
  schedule:
    # 朝: 22:00 UTC = 7:00 JST
    - cron: '0 22 * * *'
    # 昼: 04:00 UTC = 13:00 JST
    - cron: '0 4 * * *'
    # 晩: 10:00 UTC = 19:00 JST
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: '投稿スロット (morning/noon/evening)'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - noon
          - evening

env:
  TZ: Asia/Tokyo

jobs:
  auto-post:
    name: auto-post
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: install-deps
        run: pip install -r requirements.txt

      - name: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: install-claude-cli
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: validate-token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set in GitHub Secrets"
            exit 1
          fi
          echo "::notice::OAuth token validated"

      - name: determine-slot
        run: |
          echo "DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)" >> $GITHUB_ENV
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "SLOT=${{ github.event.inputs.slot }}" >> $GITHUB_ENV
          else
            case "${{ github.event.schedule }}" in
              "0 22 * * *") echo "SLOT=morning" >> $GITHUB_ENV ;;
              "0 4 * * *")  echo "SLOT=noon"    >> $GITHUB_ENV ;;
              "0 10 * * *") echo "SLOT=evening" >> $GITHUB_ENV ;;
              *)             echo "SLOT=morning" >> $GITHUB_ENV ;;
            esac
          fi

      - name: generate-and-post
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: |
          echo "::notice::Slot: $SLOT / Date: $DATE"
          python3 workflow/auto_post.py "$SLOT"
