name: "投稿分析（週次）"

# 毎週日曜 23:59 JST に、その週（月曜0時〜日曜23:59）の投稿の反応を分析し、
# 月曜からの自動投稿の改善方針（workflow/insights.md）を更新する。
# GitHubの予約起動は遅れたり実行されなかったりするので、予備の起動を2回仕掛ける
# （その週のレポートが作成済みなら、予備の起動は何もせず終わる）。
on:
  schedule:
    - cron: '59 14 * * 0'   # 日曜 23:59 JST
    - cron: '59 16 * * 0'   # 予備: 月曜 1:59 JST
    - cron: '59 18 * * 0'   # 予備: 月曜 3:59 JST
  workflow_dispatch:

concurrency:
  group: x-analyze
  cancel-in-progress: false

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: install-claude-cli
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: weekly-review
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: python3 workflow/weekly_review.py

      - name: commit-review
        run: |
          git config user.name "hajime-bot[workflow]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add workflow/insights.md workflow/reports
          if git diff --cached --quiet; then
            echo "::notice::変更なし"
            exit 0
          fi
          git commit -m "analysis: [$(TZ=Asia/Tokyo date +%Y-%m-%d)] 週次レビュー・改善方針を更新"
          for i in 1 2 3 4; do
            git pull --rebase -q origin master && git push -q origin HEAD:master && exit 0
            sleep $((i * 5))
          done
          exit 1
