name: "@hajime_cp X post workflow"

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

env:
  TZ: Asia/Tokyo

jobs:
  x-daily-post:
    name: daily-post
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: install-deps
        run: pip install -r requirements.txt

      - name: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: install-claude-cli
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: validate-token
        id: token_check
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set in GitHub Secrets"
            exit 1
          fi
          echo "::notice::OAuth token validated"

      - name: step1-collect-plan
        id: step1
        run: |
          DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          echo "DATE=$DATE" >> $GITHUB_ENV
          python3 workflow/01_collect_trends.py --date "$DATE"

      - name: step2-analyze-trends
        id: step2
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          DRAFT_DIR="marketing/content-plan/drafts/$DATE"
          {
            cat workflow/prompts/02_analyze_trends.md
            printf '\n\n---\n## Data\n\n'
            printf '### search_plan.json\n```json\n'
            cat "$DRAFT_DIR/search_plan.json"
            printf '\n```\n\n'
            printf '### existing_themes.json\n```json\n'
            cat "$DRAFT_DIR/existing_themes.json"
            printf '\n```\n'
          } > /tmp/prompt_step2.txt
          set +e
          OUTPUT=$(claude --print --dangerously-skip-permissions - < /tmp/prompt_step2.txt 2>&1)
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::step2 failed"
            echo "$OUTPUT"
            exit $EXIT_CODE
          fi
          echo "$OUTPUT" > "$DRAFT_DIR/raw_trends.md"
          echo "::notice::step2 done"

      - name: step3-generate-drafts
        id: step3
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          DRAFT_DIR="marketing/content-plan/drafts/$DATE"
          {
            cat workflow/prompts/03_generate_drafts.md
            printf '\n\n---\n## Data\n\n'
            printf '### raw_trends.md\n'
            cat "$DRAFT_DIR/raw_trends.md"
            printf '\n\n### existing_themes.json\n```json\n'
            cat "$DRAFT_DIR/existing_themes.json"
            printf '\n```\n\n'
            printf '### feedback.md（はじめさんからの改善フィードバック）\n'
            cat workflow/feedback.md
          } > /tmp/prompt_step3.txt
          set +e
          OUTPUT=$(claude --print --dangerously-skip-permissions - < /tmp/prompt_step3.txt 2>&1)
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::step3 failed"
            echo "$OUTPUT"
            exit $EXIT_CODE
          fi
          echo "$OUTPUT" > "$DRAFT_DIR/drafts.md"
          echo "::notice::step3 done"

      - name: step4-verify-template
        run: python3 workflow/03_verify_drafts.py --date "$DATE"

      - name: step5-verify-facts
        id: step5
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          DRAFT_DIR="marketing/content-plan/drafts/$DATE"
          {
            cat workflow/prompts/05_verify_facts.md
            printf '\n\n---\n## Data\n\n'
            printf '### drafts.md\n'
            cat "$DRAFT_DIR/drafts.md"
            printf '\n\n### verification_template.json\n```json\n'
            cat "$DRAFT_DIR/verification_template.json"
            printf '\n```\n'
          } > /tmp/prompt_step5.txt
          set +e
          OUTPUT=$(claude --print --dangerously-skip-permissions - < /tmp/prompt_step5.txt 2>&1)
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::step5 failed"
            echo "$OUTPUT"
            exit $EXIT_CODE
          fi
          echo "$OUTPUT" > "$DRAFT_DIR/verification_log.md"
          echo "::notice::step5 done"

      - name: commit-drafts
        run: |
          git config user.name "hajime-bot[workflow]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "marketing/content-plan/drafts/$DATE/"
          if git diff --cached --quiet; then
            echo "::notice::nothing to commit"
            exit 0
          fi
          git commit -m "draft: [$DATE] drafts ready for review"
          git push

      - name: notify-schedule
        run: |
          echo "::notice::Drafts saved to marketing/content-plan/drafts/$DATE/drafts.md"
          echo "::notice::Follow scripts/x-schedule-post.md to schedule posts"

      - name: notify-token-expiry
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          STEP2_RESULT: ${{ steps.step2.outcome }}
          STEP3_RESULT: ${{ steps.step3.outcome }}
          STEP5_RESULT: ${{ steps.step5.outcome }}
        with:
          script: |
            const failedSteps = ['step2', 'step3', 'step5']
              .filter(s => process.env[`${s.toUpperCase()}_RESULT`] === 'failure');
            if (failedSteps.length === 0) return;

            const now = new Date().toLocaleString('ja-JP', {timeZone: 'Asia/Tokyo'});
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'token-expired',
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: 'Workflow failed again at ' + now + ' JST. Steps: ' + failedSteps.join(', '),
              });
              return;
            }
            const bodyLines = [
              '## Claude OAuth token renewal required',
              '',
              'Failed at: ' + now + ' JST',
              'Failed steps: ' + failedSteps.join(', '),
              '',
              '### Steps to fix',
              '1. Run `claude setup-token` locally and copy the token',
              '2. Go to Settings > Secrets > CLAUDE_CODE_OAUTH_TOKEN > Update',
              '3. Re-run the workflow from the Actions tab',
              '4. Close this issue',
              '',
              'Note: Use CLAUDE_CODE_OAUTH_TOKEN, not ANTHROPIC_API_KEY',
            ];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[ACTION REQUIRED] Claude OAuth token expired (' + now + ')',
              labels: ['token-expired', 'bot'],
              body: bodyLines.join('\n'),
            });
